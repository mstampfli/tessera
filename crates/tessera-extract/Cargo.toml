[package]
name = "tessera-extract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Content sniffing, chunking, built-in extractors, the security entity pack, and the subprocess plugin host. All ingested bytes are untrusted."

[dependencies]
tessera-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
text-splitter = { version = "0.32.0", features = ["markdown"] }
pulldown-cmark = "0.13.4"
csv = "1.4.0"
infer = "0.19.0"
scraper = "0.27.0"
regex = "1.12.4"
url.workspace = true
psl = "2.1.217"
tokio.workspace = true
tracing.workspace = true
toml = "1.1.2"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# This crate cannot inherit the workspace `unsafe_code = "forbid"` because the
# subprocess plugin host needs one unsafe FFI block (setrlimit/setpgid in a
# pre_exec hook). We keep unsafe DENIED (overridable per-item) instead, and
# mirror the workspace clippy config.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
cast_precision_loss = "allow"
