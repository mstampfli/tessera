# Example tessera.toml. Copy to tessera.toml and adjust. This file holds
# non-secret configuration only; the database URL comes from DATABASE_URL and
# the admin password from TESSERA_ADMIN_PASSWORD or stdin.

[server]
# Address the API binds to. Loopback for local dev; in production set this to
# the host's tailnet IP so the port is never on a public or LAN interface.
bind = "127.0.0.1:8080"
# Set true in production (behind Caddy TLS) so session cookies carry `Secure`.
secure_cookies = false

[database]
# Overridden by DATABASE_URL when set. Shown here for reference only.
url = "postgres://tessera:tessera@127.0.0.1:5432/tessera"
max_connections = 10
worker_max_connections = 6

[cas]
# Filesystem root of the content-addressed store for raw ingested bytes.
path = "./data/cas"

[log]
# "pretty" for local dev, "json" for production. Logs always go to stderr.
format = "pretty"
filter = "info,tessera=debug,sqlx=warn"

[providers]
# Embedding backend: "ollama" (default) or "fastembed" (in-process ONNX, requires
# building with --features fastembed).
embedder = "ollama"
# Ordered LLM fallback chain for synthesis and ask.
llm_chain = ["ollama"]

[providers.ollama]
base_url = "http://127.0.0.1:11434"
embed_model = "nomic-embed-text"
chat_model = "qwen2.5:3b"
timeout_secs = 120

[providers.claude_cli]
bin = "claude"
timeout_secs = 180
max_concurrency = 1

[pipeline]
workers = 4
embed_batch = 64
# Max cosine distance for a chunk to join a cluster (model dependent).
cluster_max_distance = 0.4
# New members before a cluster's insight is re-synthesized.
cluster_dirty_threshold = 3
# Debounce (seconds) before synthesizing a dirty cluster.
synth_debounce_secs = 30
