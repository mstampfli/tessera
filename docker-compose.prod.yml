# Production stack for a single host. Brings up Postgres (pgvector), applies
# migrations once, then starts the backend and the frontend.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# House hardening (matches the homelab pattern):
#  - The DB publishes NO host port; it is reachable only on the internal network.
#  - Services bind to ${APP_BIND} (default loopback). On a tailnet host set
#    APP_BIND to that host's tailnet IP so the ports are reachable by the proxy
#    but not on any public/LAN interface.
#  - Pin this file on the server with COMPOSE_FILE=docker-compose.prod.yml in
#    .env so a stray `docker compose up` cannot fall back to the dev file.
#
# Caddy (on the hub) terminates TLS and routes /api/* to the backend and
# everything else to the frontend. See deploy/Caddyfile.snippet.
#
# Embeddings: the default build talks to a host Ollama (host-gateway). For a
# CPU-only host with no Ollama (e.g. cp1), build the backend with
# `--build-arg FEATURES=fastembed` and set TESSERA__PROVIDERS__EMBEDDER=fastembed.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tessera
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera -d tessera"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://tessera:${POSTGRES_PASSWORD}@db:5432/tessera
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FEATURES: ${BACKEND_FEATURES:-}
    restart: unless-stopped
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://tessera:${POSTGRES_PASSWORD}@db:5432/tessera
      TESSERA__SERVER__BIND: 0.0.0.0:8080
      TESSERA__SERVER__SECURE_COOKIES: "true"
      TESSERA__CAS__PATH: /data/cas
      TESSERA__LOG__FORMAT: json
      # Reach a host Ollama by default; override for the fastembed CPU build.
      TESSERA__PROVIDERS__OLLAMA__BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      TESSERA__PROVIDERS__EMBEDDER: ${EMBEDDER:-ollama}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cas:/data/cas
      - fastembed_cache:/app/.fastembed_cache
    ports:
      - "${APP_BIND:-127.0.0.1}:8400:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # The Next server proxies /api to the backend on the internal network only
      # in dev; in production Caddy routes /api directly to the backend, so this
      # is a fallback for same-origin requests that reach the Next server.
      TESSERA_API_ORIGIN: http://backend:8080
    ports:
      - "${APP_BIND:-127.0.0.1}:8401:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  cas:
  fastembed_cache:
